const nav=document.querySelector('.emotions'),faces=document.querySelector('.faces'),status=document.querySelector('.status');
let active='idle',clock=0,last=null,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,ready=false,requestId=0;
const cache=new Map(),contexts={},gifLinks={};
for(const [id,name] of Object.entries(styles)){
 const article=document.createElement('article');article.className='face';
 article.innerHTML=`<div class="screen"><canvas width="320" height="240" role="img" aria-label="${id} ${name}动画"></canvas></div><h2><span>${id}</span>${name}</h2><p>${descriptions[id]}</p><a class="gif" href="previews/${id}/idle.gif">查看 GIF</a><a href="previews/${id}/contact.png">逐帧表</a>`;
 faces.append(article);contexts[id]=article.querySelector('canvas').getContext('2d');gifLinks[id]=article.querySelector('.gif');
}
for(const [id,state] of Object.entries(states)){
 const button=document.createElement('button');button.type='button';button.textContent=state.label;button.dataset.state=id;button.setAttribute('aria-pressed',id===active);button.onclick=()=>select(id);nav.append(button);
}
const themeSelect=document.getElementById('theme');
for(const theme of themes){const option=document.createElement('option');option.value=theme.theme;option.textContent=theme.theme;themeSelect.append(option);}
themeSelect.onchange=()=>{const theme=themes.find(t=>t.theme===themeSelect.value);const allowed=theme?theme.proposed_animations:Object.keys(states);for(const button of nav.children)button.hidden=!allowed.includes(button.dataset.state);document.getElementById('theme-note').textContent=theme?`${theme.candidate_count} 条候选 · 建议映射待原声确认`:'按表达主题查看建议表情';if(!allowed.includes(active))select(allowed[0]);};
function image(path){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(Error(path));im.src=path;});}
async function select(state){
 const serial=++requestId;ready=false;active=state;clock=0;last=null;status.textContent='正在载入…';
 for(const button of nav.children)button.setAttribute('aria-pressed',button.dataset.state===state);
 try{
  if(!cache.has(state)){const group={};await Promise.all(Object.keys(styles).map(async style=>{group[style]=await Promise.all(Array.from({length:8},(_,i)=>image(`frames/${style}/${state}/${String(i).padStart(2,'0')}.png`)));}));cache.set(state,group);}
  if(serial!==requestId)return;
  for(const style of Object.keys(styles))gifLinks[style].href=`previews/${style}/${state}.gif`;
  ready=true;render();updateStatus();
 }catch(error){if(serial===requestId)status.textContent='帧未找到，请保留完整资源目录。';console.error(error);}
}
function render(){if(!ready)return;let remaining=clock%states[active].durations_ms.reduce((a,b)=>a+b,0),frame=0;for(const duration of states[active].durations_ms){if(remaining<duration)break;remaining-=duration;frame++;}frame=Math.min(frame,7);for(const id of Object.keys(styles))contexts[id].drawImage(cache.get(active)[id][frame],0,0);}
function updateStatus(){document.getElementById('pause').textContent=paused?'播放':'暂停';status.textContent=`${states[active].label} · ${paused?'已暂停':'循环播放'}`;}
document.getElementById('pause').onclick=()=>{paused=!paused;last=null;updateStatus();};
document.getElementById('restart').onclick=()=>{clock=0;last=null;render();};
document.addEventListener('visibilitychange',()=>{last=null;});
function tick(now){if(!document.hidden&&ready&&!paused&&last!==null)clock+=now-last;last=now;render();requestAnimationFrame(tick);}
select('idle');requestAnimationFrame(tick);
</script>
</html>
