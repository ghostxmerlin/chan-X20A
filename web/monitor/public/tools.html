<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>hello 工具</title>
  <link rel="stylesheet" href="/crowd-flow.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <h1>hello 工具清单</h1>
    <a href="/">← 观察台</a>
  </div>
  <p class="lead">hello 能调用的每一项能力。技能和千问都从这里选工具。权威来源：<code>config/tools/registry.json</code>；规矩见 <code>docs/hello-tools.md</code>。</p>
  <p id="tools-summary" class="lead">读取中…</p>
  <div class="tools-filter" role="group" aria-label="按状态筛选">
    <button data-status="" aria-pressed="true">全部</button>
    <button data-status="live" aria-pressed="false">已接入</button>
    <button data-status="have" aria-pressed="false">已有接口</button>
    <button data-status="wrap" aria-pressed="false">要开接口</button>
    <button data-status="new" aria-pressed="false">要新做</button>
  </div>
</header>
<section id="proposals" class="try-panel" aria-live="polite">
  <h2>待确认</h2>
  <p class="small">hello 想做、要主人点头的事（别人提的、或千问自己想做的）。同意后立刻执行；24 小时没处理就作废。</p>
  <div id="proposal-list" class="small">读取中…</div>
</section>
<section id="try-panel" class="try-panel" hidden aria-live="polite">
  <h2 id="try-title">试一下</h2>
  <label for="try-args" class="small">参数（JSON）</label>
  <textarea id="try-args" rows="4" spellcheck="false"></textarea>
  <div><button id="try-run">运行</button></div>
  <pre id="try-out"></pre>
</section>
<main id="tools-main"></main>
<script type="module" src="/tools-ui.js"></script>
</body>
</html>
